services:
  hammer:
    container_name: Hammer
    pull_policy: build
    build:
      context: .
      dockerfile: Hammer/Dockerfile
    volumes:
      - ${DATA_DIR}:/app/data
      - ${LOGS_DIR}:/app/logs
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
